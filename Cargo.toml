[package]
name = "cordis-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Cordis-compatible plugin runtime in Rust (DSH GPUI reimplementation PoC)"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Seduce0068/cordis-rs"
documentation = "https://docs.rs/cordis-rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
futures = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
tokio = { version = "=1.48.0", features = ["sync", "rt", "time", "process", "io-util"] }

[dev-dependencies]
# Cargo unions features: the library needs only sync/rt/time, while tests need
# macros and rt-multi-thread. The exact pin is shared to avoid dependency skew.
tokio = { version = "=1.48.0", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[profile.dev]
# debuginfo は line tables のみに抑制し、バックトレースは保持する。
debug = "line-tables-only"

[profile.dev.package."*"]
# 依存クレートの debuginfo は生成しない。
debug = false

[profile.release]
strip = true
