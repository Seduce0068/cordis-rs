[package]
name = "cordis-rs"
version = "0.1.0"
edition = "2024"
description = "Cordis-compatible plugin runtime in Rust (DSH GPUI reimplementation PoC)"
license = "MIT"

[dependencies]
async-trait = "0.1"
futures = "0.3"
thiserror = "2"
tokio = { version = "=1.48.0", features = ["sync", "rt"] }

[dev-dependencies]
tokio = { version = "=1.48.0", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
