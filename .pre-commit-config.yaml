# Local pre-commit gate. Install once with `pre-commit install`.
# This can be bypassed with `git commit --no-verify`; CI runs Betterleaks over
# the full history as the authoritative final gate (.github/workflows/ci.yml).
# Betterleaks v1.10.1 is the primary hook; gitleaks is kept as an auxiliary one.
repos:
  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.10.1
    hooks:
      - id: betterleaks
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
