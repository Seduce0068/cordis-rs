# 個人リポジトリ共通の再利用可能ワークフロー（Seduce0068/workflows）へ委譲する。
# rust-gates.yml（Rust ゲート）と secret-gates.yml（Betterleaks 最終ゲート）。
name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Betterleaks v1.10.1 full-history scan (v1 tag pinned). Authoritative final
  # gate for secrets: the scanner's exit code fails the job (fail-close) and
  # cannot be bypassed with `git commit --no-verify` / `SKIP=betterleaks`.
  secret-scan:
    uses: Seduce0068/workflows/.github/workflows/secret-gates.yml@v1
    with:
      betterleaks_version: v1.10.1

  gates:
    uses: Seduce0068/workflows/.github/workflows/rust-gates.yml@v1
    with:
      clippy_args: -A clippy::type_complexity -D clippy::undocumented_unsafe_blocks
      audit: true
      extra_gates: |
        bash scripts/check-secrets.sh
        bash scripts/check-markdown.sh
        bash scripts/smoke-examples.sh
        bash scripts/check-no-unsafe.sh
        bash scripts/check-doc-counts.sh
        bash scripts/check-lean.sh
